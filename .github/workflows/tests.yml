name: Tests

# Headless unit tests for the GUI-free core of LiteDicom.py (DICOM loading,
# HU conversion, slice ordering/spacing, material classification).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy pillow pydicom pytest
      - run: python -m py_compile LiteDicom.py
      - run: python -m pytest -q
